        {
          "@type": "Question",
          "name": "A Canis realmente trabalha com desentupidoras?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A Canis é agência Google Partner e já trabalha com empresas do segmento de desentupimento, conhecendo as particularidades de campanhas para serviços emergenciais, onde localização, intenção de busca, velocidade de atendimento e custo por chamado fazem toda a diferença."
          }
        },
        {
          "@type": "Question",
          "name": "Google Ads funciona para desentupidora?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Google Ads é um dos principais canais de aquisição para desentupidoras, porque permite aparecer exatamente quando a pessoa pesquisa por um serviço de desentupimento. O resultado depende da concorrência da região, estrutura da campanha e atendimento — é isso que analisamos na conversa inicial."
          }
        },
        {
          "@type": "Question",
          "name": "Vocês cuidam do Google Meu Negócio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Otimizamos o Perfil da Empresa no Google (antigo Google Meu Negócio) para aumentar a presença nas pesquisas locais e no Google Maps, incluindo estratégia de avaliações e áreas atendidas."
          }
        },
        {
          "@type": "Question",
          "name": "Vocês criam a página para anunciar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Desenvolvemos landing pages de alta conversão pensadas para campanhas de desentupidora, priorizando celular, botão de WhatsApp, ligação direta e velocidade de carregamento."
          }
        },
        {
          "@type": "Question",
          "name": "Já tenho Google Ads. Vocês podem assumir minha conta?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. Primeiro analisamos a estrutura atual e identificamos o que pode ser mantido, corrigido ou reconstruído para melhorar o custo por chamado."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto preciso investir em anúncios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Varia conforme cidade, raio de atendimento, concorrência e serviços anunciados. Na conversa inicial analisamos sua região e definimos uma faixa de investimento coerente com sua operação."
          }
        }
